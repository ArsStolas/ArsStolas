<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="170" viewBox="0 0 640 170" role="img" aria-labelledby="title"><title id="title">Merci d’être passé. À bientôt, Léo.</title><g font-family="Segoe UI,Arial,sans-serif"><style>
  .float-a{animation:float 7s ease-in-out infinite}.float-b{animation:float 9s ease-in-out -3s infinite}.float-c{animation:float 8s ease-in-out -5s infinite}
